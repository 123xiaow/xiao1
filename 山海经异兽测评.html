// ========== 映射 ==========
function getBeast(energy) {
  const sorted = Object.entries(energy).sort((a,b) => b[1]-a[1]);
  const main = sorted[0][0], sub = sorted[1][0];
  const map = {"火-木":"凤凰","火-金":"毕方","木-火":"九尾狐","木-土":"鹿蜀","土-木":"当康","土-金":"白泽","金-火":"天狗","金-土":"麒麟","水-木":"鲛人","水-金":"何罗鱼","水-火":"精卫","水-土":"鲲鹏"};
  return map[main+"-"+sub] || map[sub+"-"+main] || "鲲鹏";
}

// ========== 状态 ==========
let currentPassword = "";
let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);

// ========== 页面切换 ==========
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const page = document.getElementById(id);
  page.classList.add("active");
  window.scrollTo(0, 0);
}

// ========== 密码 ==========
async function checkPassword() {
  const pwd = document.getElementById("password-input").value.trim();
  const errEl = document.getElementById("password-error");
  errEl.textContent = "";
  if (!pwd) { errEl.textContent = "请输入密码"; return; }
  const btn = event.target;
  btn.textContent = "验证中...";
  btn.disabled = true;
  try {
    const { data, error } = await supabase
      .from("passwords")
      .select("*")
      .eq("password", pwd)
      .single();
    if (error || !data) {
      errEl.textContent = "密码不正确，请检查后重试";
      btn.textContent = "开 始 测 评";
      btn.disabled = false;
      return;
    }
    if (data.used_count >= data.max_uses) {
      errEl.textContent = "该密码已用完3次测试机会";
      btn.textContent = "开 始 测 评";
      btn.disabled = false;
      return;
    }
    currentPwdId = data.id;
    currentPassword = pwd;
    renderBeastGrid();
    showPage("page-intro");
    btn.textContent = "开 始 测 评";
    btn.disabled = false;
  } catch (e) {
    errEl.textContent = "网络错误，请稍后重试";
    btn.textContent = "开 始 测 评";
    btn.disabled = false;
  }
}

// ========== 图鉴 ==========
function renderBeastGrid() {
  document.getElementById("beast-grid").innerHTML = beastList.map(b =>
    `<div class="beast-card"><img src="${beastImages[b.name]}" alt="${b.name}"><div class="beast-name">${b.name}</div><div class="beast-desc">${b.desc}</div></div>`
  ).join("");
}

// ========== 答题 ==========
function startQuiz() { currentQuestion = 0; answers = new Array(questions.length).fill(null); showPage("page-quiz"); renderQuestion(); }
function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById("question-num").textContent = `第 ${currentQuestion+1} / ${questions.length} 题`;
  document.getElementById("question-text").textContent = q.q;
  document.getElementById("options").innerHTML = q.opts.map((o,i) =>
    `<div class="option ${answers[currentQuestion]===i?"selected":""}" onclick="selectOption(${i})"><span class="label">${"ABCD"[i]}</span>${o.t}</div>`
  ).join("");
  document.getElementById("progress-fill").style.width = ((currentQuestion+1)/questions.length*100)+"%";
  document.getElementById("btn-prev").style.visibility = currentQuestion===0?"hidden":"visible";
  document.getElementById("btn-next").textContent = currentQuestion===questions.length-1?"查看结果":"下一题";
}
function selectOption(i) { answers[currentQuestion]=i; renderQuestion(); }
function prevQuestion() { if(currentQuestion>0){currentQuestion--;renderQuestion();} }
function nextQuestion() {
  if(answers[currentQuestion]===null){showToast("请先选择一个选项");return;}
  if(currentQuestion<questions.length-1){currentQuestion++;renderQuestion();}
  else{showResult();}
}

// ========== 结果 ==========
function showResult() {
  const energy = {"木":0,"火":0,"土":0,"金":0,"水":0};
  answers.forEach((ans,qi)=>{if(ans!==null)energy[questions[qi].opts[ans].e]++;});
  const beastName = getBeast(energy);
  const beast = beasts[beastName];
  document.getElementById("result-img").src = beastImages[beastName];
  document.getElementById("result-name").textContent = beastName;
  document.getElementById("result-tag").textContent = beast.tag;
  document.getElementById("result-quote").textContent = beast.quote;
  document.getElementById("result-personality").textContent = beast.personality;
  document.getElementById("result-friends").textContent = beast.friends;
  document.getElementById("result-love").textContent = beast.love;
  document.getElementById("result-work").textContent = beast.work;
  document.getElementById("result-strengths").innerHTML = beast.strengths.map(s=>`<span class="tag">${s}</span>`).join("");
  document.getElementById("result-weaknesses").innerHTML = beast.weaknesses.map(s=>`<span class="tag">${s}</span>`).join("");
  document.getElementById("result-lucky").textContent = beast.lucky;
  document.getElementById("result-details").innerHTML = beast.details.map(d=>`<div class="detail-item">${d}</div>`).join("");
  document.getElementById("result-final").textContent = "💬 " + beast.final;
  const colors = {"木":"#4caf50","火":"#f44336","土":"#8d6e63","金":"#ffd700","水":"#2196f3"};
  const total = questions.length;
  document.getElementById("energy-bar").innerHTML = Object.entries(energy).map(([k,v])=>
    `<div class="energy-row"><span class="label">${k}</span><div class="bar"><div class="fill" style="width:${v/total*100}%;background:${colors[k]}"></div></div><span class="pct">${Math.round(v/total*100)}%</span></div>`
  ).join("");
  showPage("page-result");
  // 保存到数据库
  saveResultToDB(beastName, energy);
}

async function saveResultToDB(beastName, energy) {
  try {
    // 更新密码使用次数
    const { data: pwdData } = await supabase.from("passwords").select("used_count").eq("id", currentPwdId).single();
    if (pwdData) {
      await supabase.from("passwords").update({ used_count: pwdData.used_count + 1 }).eq("id", currentPwdId);
    }
    // 保存测试结果
    await supabase
      .from("test_results")
      .insert([{ password_id: currentPwdId, beast_name: beastName, energy_data: energy }]);
  } catch (e) {
    console.log("保存记录失败", e);
  }
}

// ========== 保存 ==========
function saveResult() {
  const hero = document.getElementById("result-hero");
  const body = document.getElementById("result-body");
  showToast("正在生成图片...");
  const combined = document.createElement("div");
  combined.appendChild(hero.cloneNode(true));
  combined.appendChild(body.cloneNode(true));
  combined.style.background = "#0f0e17";
  combined.style.padding = "20px";
  combined.style.borderRadius = "12px";
  combined.style.maxWidth = "440px";
  document.body.appendChild(combined);
  html2canvas(combined, {scale:2, backgroundColor:"#0f0e17"}).then(canvas=>{
    document.body.removeChild(combined);
    const link = document.createElement("a");
    link.download = "我的山海经异兽结果.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast("图片已保存");
  });
}

function showReward(){document.getElementById("reward-modal").classList.add("active");}
function closeModal(){document.getElementById("reward-modal").classList.remove("active");}
let toastTimer;
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2000);}
document.getElementById("password-input").addEventListener("keydown",e=>{if(e.key==="Enter")checkPassword();});
